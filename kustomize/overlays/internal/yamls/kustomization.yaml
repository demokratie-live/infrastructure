apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cluster
  - ingress-srv.yaml
  - bundestagio-admin-ingress.yaml

patches:
  - path: bundestagio-depl.yaml
  - path: bundestagio-admin-depl.yaml
  - path: democracy-api-depl.yaml
  - path: democracy-app-depl.yaml
  - path: import-conference-week-details.yaml
  - path: import-named-poll-deputies.yaml
  - path: import-named-polls.yaml
  - path: import-procedures.yaml
  - path: mongo-headless-service.yaml
  - path: mongo-statefulset.yaml
  - path: non-named-votes-ai.yaml
  - path: procedures.yaml

# IP-Allowlist für den Admin, bei Bedarf einkommentieren
# components:
#   - ../../../components/bundestagio-admin-allowlist

namespace: democracy-internal

images:
  - name: democracy/bundestag.io
    newTag: "0.1.74"
  - name: democracy/cleanup-push-queue
    newTag: "1.0.10"
  - name: democracy/crawler
    newTag: "1.1.14"
  - name: democracy/democracy-app.de
    newTag: "1.2.2"
  - name: democracy/import-conference-week-details
    newTag: "0.1.43"
  - name: democracy/import-deputy-profiles
    newTag: "0.1.26"
  - name: democracy/import-named-poll-deputies
    newTag: "0.1.24"
  - name: democracy/import-named-polls
    newTag: "0.1.30"
  - name: democracy/import-plenary-minutes
    newTag: "0.1.22"
  - name: democracy/index-sync-bundestagio
    newTag: "0.1.15"
  - name: democracy/index-sync-democracy
    newTag: "0.1.10"
  - name: democracy/non-named-votes-ai
    newTag: "1.1.8"
  - name: democracy/procedures
    newTag: "0.0.10"
  - name: democracy/push-send-queued
    newTag: "0.1.32"
  - name: democracy/qr-code-handler
    newTag: "1.0.16"
  - name: democracy/queue-pushs-conference-week
    newTag: "0.1.15"
  - name: democracy/queue-pushs-vote-conference-week
    newTag: "0.1.13"
  - name: democracy/queue-pushs-vote-top-100
