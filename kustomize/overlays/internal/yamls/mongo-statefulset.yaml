apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  template:
    spec:
      containers:
        - name: mongo
          command:
            - mongod
            - "--bind_ip_all"
            - "--replSet"
            - rs0
          resources:
            requests:
              memory: "0.75G"
              cpu: "100m"
            limits:
              memory: "1.5G"
              cpu: "5000m"
