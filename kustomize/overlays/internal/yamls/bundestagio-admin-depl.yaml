apiVersion: apps/v1
kind: Deployment
metadata:
  name: bundestagio-admin-depl
spec:
  selector:
    matchLabels:
      app: bundestagio-admin
  template:
    spec:
      containers:
        - name: bundestagio-admin
          image: democracy/bundestag.io-admin:3.8.12@sha256:c69fdee5c0a12f6cc65575d58f8400a403cd684f3a099bbdcb6d26432c1a5cdd
          imagePullPolicy: Always
          resources:
            limits:
              memory: "200M"
              cpu: "100m"
            requests:
              memory: "100M"
              cpu: "30m"
