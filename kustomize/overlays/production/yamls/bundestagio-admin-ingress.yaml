# Eigener Ingress für den Admin, damit Schutz-Annotationen nur hier greifen.
# Das Secret bundestagio-admin-basic-auth (Schlüssel auth, htpasswd-Format) wird
# außerhalb des Repos angelegt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bundestagio-admin
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: bundestagio-admin-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'bundestag.io admin'
    nginx.ingress.kubernetes.io/limit-rps: '20'
spec:
  tls:
    - hosts:
        - admin.bundestag.io
      secretName: bundestagio-admin-tls
  rules:
    - host: admin.bundestag.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bundestagio-admin-srv
                port:
                  number: 3000
