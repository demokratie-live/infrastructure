apiVersion: apps/v1
kind: Deployment
metadata:
  name: bundestagio-admin-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bundestagio-admin
  template:
    metadata:
      labels:
        app: bundestagio-admin
        # Nur Pods mit diesem Label bekommen die Freigaben der NetworkPolicy
        # bundestagio-admin. Alle anderen Admin-Pods bleiben gesperrt.
        network-policy: bundestagio-admin
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bundestagio-admin
          image: democracy/bundestag.io-admin:3.8.10@sha256:0752905a413e8ca05c4bc643e3406154c093b0c24d86d9e9851292ebc0fe1017
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AI_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-votes-access-token
                  key: ACCESS_TOKEN
                  optional: false
            - name: PROCEDURES_SERVER_URL
              value: http://procedures
          envFrom:
            - configMapRef:
                name: bio-admin-config
            - secretRef:
                name: bio-admin-login
            - secretRef:
                name: bundestag-result-edit-token
            - secretRef:
                name: non-named-votes-ai-access-token
          resources:
            limits:
              memory: "200M"
              cpu: "100m"
            requests:
              memory: "100M"
              cpu: "30m"
---
apiVersion: v1
kind: Service
metadata:
  name: bundestagio-admin-srv
spec:
  selector:
    app: bundestagio-admin
  ports:
    - name: bundestagio-admin
      protocol: TCP
      port: 3000
      targetPort: 3000
