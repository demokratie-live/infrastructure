apiVersion: apps/v1
kind: Deployment
metadata:
  name: democracy-app-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: democracy-app
  template:
    metadata:
      labels:
        app: democracy-app
    spec:
      containers:
        - name: democracy-app
          image: democracy/democracy-app.de:1.2.3@sha256:2887cecb771fb49fc1df50a7851b987e0850d9d9bcfb5a08012f52db930ba787
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: democracy-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: democracy-app-srv
spec:
  selector:
    app: democracy-app
  ports:
    - name: democracy-app
      protocol: TCP
      port: 3000
      targetPort: 3000
