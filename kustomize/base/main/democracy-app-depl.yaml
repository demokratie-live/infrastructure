apiVersion: apps/v1
kind: Deployment
metadata:
  name: democracy-app-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: democracy-app
  template:
    metadata:
      labels:
        app: democracy-app
    spec:
      containers:
        - name: democracy-app
          image: democracy/democracy-app.de:1.2.4@sha256:6036cdfa000ad4f3ac75edae0b5df1fa68332ea5de9602389856c16cd8aa2680
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: democracy-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: democracy-app-srv
spec:
  selector:
    app: democracy-app
  ports:
    - name: democracy-app
      protocol: TCP
      port: 3000
      targetPort: 3000
