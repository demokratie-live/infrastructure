resources:
  - ../gorush
  - bundestagio-admin-depl.yaml
  - bundestagio-depl.yaml
  - votes-ai.yaml
  - non-named-votes-ai.yaml
  - procedures.yaml
  - bundestagio-dip-depl.yaml
  - democracy-api-depl.yaml
  - democracy-app-depl.yaml
  - nats-depl.yaml
  - democracy-sync-procedures-cronjob.yaml
  - democracy-sync-named-polls-cronjob.yaml
  - democracy-sync-deputy-profiles.yaml
  - queue-pushs-conference-week.yaml
  - cleanup-push-queue.yaml
  - queue-pushs-vote-conference-week.yaml
  - queue-pushs-vote-top-100.yaml
  # - push-send-queued.yaml
  - import-procedures.yaml
  - import-conference-week-details.yaml
  - import-deputy-profiles-period-18.yaml
  - import-deputy-profiles-period-19.yaml
  - import-deputy-profiles-period-20.yaml
  - import-deputy-profiles-period-21.yaml
  - import-named-polls.yaml
  - import-plenary-minutes.yaml
  - import-named-poll-deputies.yaml
  - shedule-bio-resync.yaml
  - index-sync-democracy.yaml
  - index-sync-bundestagio.yaml
  - qr-code-handler-depl.yaml

# Abgeschlossene Jobs nach 7 Tagen automatisch entfernen. Ohne diese TTL bleibt je
# CronJob ein fehlgeschlagenes Job-Objekt dauerhaft liegen und löst endlos
# KubeJobFailed/KubeJobCompletion aus (siehe TASK-9).
patches:
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/ttlSecondsAfterFinished
        value: 604800
