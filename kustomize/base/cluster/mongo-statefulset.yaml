apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  selector:
    matchLabels:
      app: mongo
  serviceName: 'mongo'
  replicas: 1
  template:
    metadata:
      labels:
        app: mongo
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:4
          ports:
            - containerPort: 27017
          # Bereit erst als PRIMARY oder SECONDARY, damit mongo-pdb nur
          # Mitglieder zählt, die im Replica Set mitarbeiten.
          readinessProbe:
            exec:
              command:
                - mongo
                - --quiet
                - --eval
                - 'var m=db.isMaster(); quit(m.ismaster || m.secondary ? 0 : 1)'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongo-volume
              mountPath: /data/db
          resources:
            limits:
              memory: '1.5Gi'
              cpu: '500m'
  volumeClaimTemplates:
    - metadata:
        name: mongo-volume
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
